```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Dhanishtha 🎂</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ffd6e7, #d8c7ff, #c9f3ff);
}

/* Pages */
.page {
    position: absolute;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 20px;
    opacity: 0;
    visibility: hidden;
    transform: scale(0.95);
    transition: 0.8s ease;
}

.page.active {
    opacity: 1;
    visibility: visible;
    transform: scale(1);
}

/* Card */
.card {
    width: 90%;
    max-width: 650px;
    padding: 45px 25px;
    border-radius: 30px;
    background: rgba(255,255,255,0.28);
    backdrop-filter: blur(15px);
    border: 1px solid rgba(255,255,255,0.5);
    box-shadow: 0 15px 50px rgba(0,0,0,0.15);
    z-index: 10;
}

.small {
    font-size: 18px;
    color: #5d466b;
    margin-bottom: 12px;
}

h1 {
    font-size: clamp(42px, 9vw, 72px);
    color: #ff4f91;
    text-shadow: 0 0 20px rgba(255,79,145,0.5);
    animation: glow 2s infinite alternate;
}

.name {
    font-size: clamp(30px, 7vw, 55px);
    font-weight: bold;
    color: #7048b8;
    margin-top: 5px;
}

.cake {
    font-size: 90px;
    margin: 20px 0;
    animation: bounce 1.5s infinite;
}

/* Button */
button {
    border: none;
    padding: 14px 28px;
    border-radius: 30px;
    font-size: 17px;
    font-weight: bold;
    color: white;
    background: linear-gradient(90deg, #ff4f91, #7048b8);
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(112,72,184,0.3);
    transition: 0.3s;
}

button:hover {
    transform: scale(1.08);
}

/* Message */
.message {
    font-size: 19px;
    line-height: 1.7;
    color: #49384f;
    margin: 20px auto;
    max-width: 500px;
}

.back {
    margin-top: 10px;
    background: rgba(112,72,184,0.8);
}

/* Balloons */
.balloon {
    position: absolute;
    width: 55px;
    height: 70px;
    border-radius: 50%;
    opacity: 0.85;
    animation: float 5s ease-in-out infinite;
}

.balloon::after {
    content: "";
    position: absolute;
    width: 1px;
    height: 100px;
    background: #777;
    left: 50%;
    top: 68px;
}

.b1 { background:#ff6b9d; left:7%; top:15%; }
.b2 { background:#8e6cff; right:8%; top:20%; animation-delay:1s; }
.b3 { background:#54d9c0; left:15%; bottom:10%; animation-delay:2s; }
.b4 { background:#ffc857; right:15%; bottom:12%; animation-delay:3s; }

/* Confetti */
.confetti {
    position: absolute;
    width: 9px;
    height: 15px;
    top: -20px;
    animation: fall linear infinite;
}

/* Animations */
@keyframes glow {
    from { text-shadow: 0 0 10px rgba(255,79,145,0.3); }
    to { text-shadow: 0 0 30px rgba(255,79,145,0.8); }
}

@keyframes bounce {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
}

@keyframes float {
    0%,100% { transform: translateY(0) rotate(-3deg); }
    50% { transform: translateY(-25px) rotate(3deg); }
}

@keyframes fall {
    from {
        transform: translateY(-20px) rotate(0deg);
    }
    to {
        transform: translateY(110vh) rotate(720deg);
    }
}
</style>
</head>

<body>

<!-- Balloons -->
<div class="balloon b1"></div>
<div class="balloon b2"></div>
<div class="balloon b3"></div>
<div class="balloon b4"></div>

<!-- Confetti -->
<div class="confetti" style="left:5%;animation-duration:4s;background:#ff4f91"></div>
<div class="confetti" style="left:15%;animation-duration:5s;background:#7048b8"></div>
<div class="confetti" style="left:25%;animation-duration:3.5s;background:#ffc857"></div>
<div class="confetti" style="left:35%;animation-duration:4.5s;background:#54d9c0"></div>
<div class="confetti" style="left:48%;animation-duration:3s;background:#ff4f91"></div>
<div class="confetti" style="left:60%;animation-duration:5s;background:#7048b8"></div>
<div class="confetti" style="left:72%;animation-duration:4s;background:#ffc857"></div>
<div class="confetti" style="left:85%;animation-duration:3.5s;background:#54d9c0"></div>
<div class="confetti" style="left:95%;animation-duration:5s;background:#ff4f91"></div>


<!-- PAGE 1 -->
<section class="page active" id="page1">

    <div class="card">

        <div class="small">🎉 Today is a special day! 🎉</div>

        <h1>Happy Birthday</h1>

        <div class="name">Dhanishtha 💖</div>

        <div class="cake">🎂</div>

        <button onclick="nextPage()">
            Continue → 🎁
        </button>

    </div>

</section>


<!-- PAGE 2 -->
<section class="page" id="page2">

    <div class="card">

        <div class="cake">💐</div>

        <h1 style="font-size:45px;">
            For You 💖
        </h1>

        <div class="message">

            Happy Birthday, Dhanishtha! 🎂💖
            <br>
            Keep smiling and stay happy always. 😊
            <br>
            May all your wishes come true. ✨
            <br>
            I’m lucky to have you as my best friend. 🫶
            <br>
            Have an amazing day! 🎉

        </div>

        <button class="back" onclick="firstPage()">
            ← Back
        </button>

    </div>

</section>


<script>

function nextPage() {
    document.getElementById("page1").classList.remove("active");
    document.getElementById("page2").classList.add("active");
}

function firstPage() {
    document.getElementById("page2").classList.remove("active");
    document.getElementById("page1").classList.add("active");
}

</script>

</body>
</html>
```
